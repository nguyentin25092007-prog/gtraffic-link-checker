<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hỗ Trợ Vượt Link Gtraffic</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f4f6f9; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; max-width: 480px; width: 100%; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #0d6efd; margin-bottom: 15px; text-align: center; font-size: 20px; }
        .step { background: #e7f1ff; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; line-height: 1.5; }
        .btn { display: block; width: 100%; padding: 12px; background: #0d6efd; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; margin-top: 8px; }
        .btn:hover { background: #0b5ed7; }
        input[type="text"] { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h2>Hỗ Trợ Vượt Link Gtraffic</h2>
    
    <div class="step">
        <strong>Bước 1:</strong> Mở link gốc để xem từ khóa.
        <a href="https://gtraffic.io/9Qa6Fn9" target="_blank" class="btn">Mở Link Gtraffic</a>
    </div>

    <div class="step">
        <strong>Bước 2:</strong> Nhập từ khóa tìm kiếm trên Google.
        <input type="text" id="keyword" value="Sunwin play and win" placeholder="Nhập từ khóa...">
        <button class="btn" onclick="searchGoogle()">Mở Google Tìm Kiếm</button>
    </div>

    <div class="step">
        <strong>Bước 3:</strong> Cuộn xuống cuối trang đích bấm nút <b>"Lấy Mã"</b> và chờ đếm ngược.
    </div>

    <div class="step">
        <strong>Bước 4:</strong> Copy mã nhận được và dán vào ô xác nhận để hoàn tất.
    </div>
</div>

<script>
    function searchGoogle() {
        const kw = document.getElementById('keyword').value;
        if (kw.trim() !== '') {
            window.open('https://www.google.com/search?q=' + encodeURIComponent(kw), '_blank');
        } else {
            alert('Vui lòng nhập từ khóa!');
        }
    }
</script>

</body>
</html>
