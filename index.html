
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAYMA LINK CHECKER</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:25px 16px;
  background:#0b1020;color:white;
  font-family:Arial,sans-serif;
}
.container{
  max-width:480px;margin:55px auto;
  background:#151d32;padding:25px;
  border-radius:20px;
  border:1px solid #34415e;
}
h1{text-align:center;color:#60a5fa}
p{text-align:center;color:#aab5ca}
input{
  width:100%;padding:15px;
  border-radius:10px;border:1px solid #52617e;
  background:#0b1020;color:white;
  font-size:15px;margin:15px 0;
}
button{
  width:100%;padding:14px;
  margin:7px 0;border:0;border-radius:10px;
  background:#2563eb;color:white;
  font-size:16px;font-weight:bold;
}
.result{
  margin-top:20px;padding:15px;
  background:#0b1020;border-radius:10px;
  overflow-wrap:anywhere;
}
a{color:#60a5fa}
.small{font-size:12px;color:#8995aa}
</style>
</head>
<body>
<div class="container">
  <h1>🔗 LAYMA LINK CHECKER</h1>
  <p>Công cụ phân tích đường dẫn</p>

  <input id="link" placeholder="Dán link LAYMA.NET vào đây">

  <button onclick="analyze()">PHÂN TÍCH LINK</button>

  <div class="result" id="result">
    Kết quả sẽ hiển thị tại đây.
  </div>

  <button id="copy" onclick="copyLink()" hidden>
    SAO CHÉP LINK ĐÍCH
  </button>

  <p class="small">
    Công cụ chỉ phân tích URL được nhúng công khai,
    không bỏ qua xác thực hoặc kiểm soát truy cập.
  </p>
</div>

<script>
let destination = "";

function analyze(){
  const input = document.getElementById("link").value.trim();
  const result = document.getElementById("result");
  const copy = document.getElementById("copy");

  destination = "";
  copy.hidden = true;

  try {
    let current = new URL(input);

    if(!["http:","https:"].includes(current.protocol)){
      throw new Error("Link không hợp lệ");
    }

    const keys = [
      "url","target","dest","destination",
      "redirect","redirect_url","link","to"
    ];

    let found = null;

    for(let i=0;i<5;i++){
      found = null;

      for(const key of keys){
        const value = current.searchParams.get(key);
        if(!value) continue;

        try{
          const decoded = decodeURIComponent(value);
          const candidate = new URL(decoded);

          if(["http:","https:"].includes(candidate.protocol)){
            found = candidate;
            break;
          }
        }catch(e){}
      }

      if(!found) break;
      current = found;
    }

    if(found){
      destination = current.href;
      result.innerHTML =
        "<b>Đã tìm thấy URL đích được nhúng:</b><br><br>" +
        "<a href='"+destination+"' target='_blank' rel='noopener noreferrer'>"+
        destination+"</a>";
      copy.hidden = false;
    }else{
      result.textContent =
        "Chưa tìm thấy URL đích được nhúng. Link có thể cần được xử lý trên máy chủ hoặc qua bước xác thực của website.";
    }

  }catch(e){
    result.textContent = "Link không hợp lệ. Vui lòng kiểm tra lại.";
  }
}

function copyLink(){
  if(destination){
    navigator.clipboard.writeText(destination)
      .then(()=>alert("Đã sao chép link!"))
      .catch(()=>alert("Không thể sao chép tự động."));
  }
}
</script>
</body>
</html>
